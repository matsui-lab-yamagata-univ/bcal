[project]
name = "yu-bcal"
dynamic = ["version"]
description = "Program for the calculation of band structure and effective mass using the tight-binding method"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.10.8",
    "numpy>=2.4.2",
    "pandas>=3.0.1",
    "scipy>=1.17.1",
    "yu-mcal>=0.7.1",
    "yu-tcal>=5.0.2",
]
authors = [
    {name = "Tomoharu Okada"},
    {name = "Koki Ozawa"},
    {name = "Yu Homma"},
    {name = "Hiroyuki Matsui", email = "h-matsui@yz.yamagata-u.ac.jp"},
]
readme = "README.md"
keywords = ["organic semiconductor", "band structure", "effective mass", "tight-binding method"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/bcal/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/bcal"]

[dependency-groups]
dev = [
    "autodoc-pydantic>=2.2.0",
    "furo>=2025.12.19",
    "sphinx>=7.4.7",
    "taskipy>=1.14.1",
]

[tool.taskipy.tasks]
generate-docs = "sphinx-apidoc -f -T -o docs src && sphinx-build -M clean docs docs/_build && sphinx-build -b html docs docs/_build/html"

[project.scripts]
bcal = "bcal.main:main"

[project.optional-dependencies]
pyscf = [
    "basis-set-exchange>=0.12",
    "pyscf>=2.12.1",
]
gpu4pyscf-cuda11 = [
    "basis-set-exchange>=0.12",
    "pyscf>=2.12.1",
    "cutensor-cu11>=2.2.0",
    "gpu4pyscf-cuda11x>=1.5.2",
]
gpu4pyscf-cuda12 = [
    "basis-set-exchange>=0.12",
    "pyscf>=2.12.1",
    "cutensor-cu12>=2.6.0",
    "gpu4pyscf-cuda12x>=1.6.0",
]
gpu4pyscf-cuda13 = [
    "basis-set-exchange>=0.12",
    "pyscf>=2.12.1",
    "cutensor-cu13>=2.6.0",
    "gpu4pyscf-cuda13x>=1.7.0",
]
orca = [
    "orca-pi",
]
