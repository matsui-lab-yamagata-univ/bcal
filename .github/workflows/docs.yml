name: Build Documentation

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: docs-build
  cancel-in-progress: true

jobs:
  build-docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Build documentation
        run: |
          uv run sphinx-apidoc -f -T -o docs-src/source src
          uv run sphinx-build -M clean docs-src/source docs
          uv run sphinx-build -b html docs-src/source docs

      - name: Remove doctrees cache
        run: rm -rf docs/.doctrees

      - name: Commit and push documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "No documentation changes to commit."
          else
            git commit -m "[docs] rebuild Sphinx documentation"
            git push
          fi
